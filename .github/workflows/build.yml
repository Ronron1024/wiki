name: Build + Publish

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      # ---------------------------------------------------
      # COMPUTE VERSION
      # ---------------------------------------------------

      # - name: Get Next Version
      #   id: semver
      #   uses: ietf-tools/semver-action@v1
      #   with:
      #     token: ${{ github.token }}
      #     branch: ${{ github.ref_name }}
      #     skipInvalidTags: true
      #     patchAll: true

      # - name: Set Build Variables
      #   run: |
      #     LATEST_TAG=$(git describe --tags --abbrev=0 --match '3.*')
      #     echo "REL_VERSION=${LATEST_TAG}-dev.g${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set Build Variables
        run: |
          echo "REL_VERSION=3.0.0-beta.$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

      - name: Set Version
        run: |
          yq -iP '.version = strenv(REL_VERSION)' backend/package.json -o json
          yq -iP '.version = strenv(REL_VERSION)' frontend/package.json -o json
          yq -i '.version = strenv(REL_VERSION) | .appVersion = strenv(REL_VERSION)' dev/chart/Chart.yaml

      # ---------------------------------------------------
      # BUILD FRONTEND
      # ---------------------------------------------------
      - name: Build Assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Blocks
        working-directory: blocks
        run: |
          npm ci
          npm run build

      # ---------------------------------------------------
      # BUILD CONTAINER IMAGES
      # ---------------------------------------------------
      - name: Generate Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=false
          images: |
            ghcr.io/ronron1024/wiki
          tags: |
            type=semver,pattern={{version}},value=${{ env.REL_VERSION }}
            type=raw,value=3.0.0-beta,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Wiki.js
            org.opencontainers.image.description=Wiki.js - Next Generation Open Source Wiki
            org.opencontainers.image.documentation=https://docs.js.wiki
          annotations: |
            org.opencontainers.image.title=Wiki.js
            org.opencontainers.image.description=Wiki.js - Next Generation Open Source Wiki
            org.opencontainers.image.documentation=https://docs.js.wiki

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dev/build/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      # ---------------------------------------------------
      # PACKAGE BUILD TARBALL
      # ---------------------------------------------------
      - name: Prepare build archive
        run: |
          mkdir -p _dist/blocks
          cp -R assets _dist/assets
          cp -R blocks/compiled _dist/blocks/compiled
          cp -R backend _dist/backend
          cp LICENSE _dist/LICENSE
          cp config.sample.yml _dist/config.sample.yml
          cd _dist/backend
          npm ci --omit=dev
          cd -
          find ./_dist/ -printf "%P\n" | tar -czf wiki-js.tar.gz --no-recursion -C ./_dist/ -T -

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: wiki-js.tar.gz

